<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#71836b">
<link rel="manifest" href="./manifest.webmanifest">
<title>Vacances en vue</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--sage:#71836b;--dark:#4e6250;--cream:#f7f5ee;--sand:#e8dfcf;--ink:#263229}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui}
header{padding:14px 16px;background:var(--sage);color:white;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:0}header small{font-size:12px}button{border:0;border-radius:11px;padding:11px 14px;background:var(--dark);color:white;font-weight:650}
button:disabled{opacity:.5}button.alt{background:var(--sand);color:var(--ink)}button.red{background:#9b4d43}
#login,#toolbar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fffdf8}
#status,#count,.hint{font-size:12px;color:#596457}#map{height:calc(100dvh - 150px);min-height:340px}
dialog{border:0;border-radius:16px;padding:0;width:min(92vw,450px);background:#fffdf8;color:var(--ink);box-shadow:0 10px 40px #0004}
dialog::backdrop{background:#0008}.head{background:var(--sage);color:white;padding:15px;font-weight:bold}
form{padding:15px;display:grid;gap:9px}label{font-size:13px;font-weight:650;color:#536052}
input,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid #d7d9ce;border-radius:9px;font:inherit}
textarea{min-height:70px}.actions{display:flex;justify-content:flex-end;gap:8px}
.popup-title{font-weight:bold;font-size:16px}.meta{font-size:11px;color:#687267;margin:7px 0}
</style>
</head>
<body>
<header><div><h1>🌿 Vacances en vue</h1><small>Nos idées d'escapades en famille</small></div><button id="add" disabled>＋ Ajouter</button></header>
<div id="login"><span id="status">Préparation de la connexion…</span><button id="connect" class="alt" hidden>Connexion Google</button><button id="logout" class="alt" hidden>Déconnexion</button></div>
<div id="toolbar"><span id="count">Carte des destinations</span><span class="hint">Touchez un repère pour voir les détails</span></div>
<div id="map"></div>
<dialog id="dlg"><div class="head" id="dlgtitle">Ajouter une destination</div><form id="form">
<input id="id" type="hidden">
<label>Nom de la destination<input id="name" required maxlength="90" placeholder="Ex. Lac d'Annecy"></label>
<label>Adresse ou lieu<input id="place" required maxlength="180" placeholder="Ville ou adresse précise"></label>
<label>Notes / annotations<textarea id="notes" maxlength="1500" placeholder="Ce qui nous plaît, idées, dates…"></textarea></label>
<label>Lien utile (facultatif)<input id="link" type="url" placeholder="https://…"></label>
<label>Lien vers une photo (facultatif)<input id="photo" type="url" placeholder="https://…"></label>
<div class="hint">Indiquez un lieu assez précis pour placer le repère sur la carte.</div>
<div class="actions"><button type="button" class="alt" id="cancel">Annuler</button><button id="save">Enregistrer</button></div>
</form></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const config={apiKey:"AIzaSyDYfYlSuF-Km6PfJ8jWWEsPmgUSMFx-YUQ",authDomain:"vacances-en-vue-26072.firebaseapp.com",projectId:"vacances-en-vue-26072",storageBucket:"vacances-en-vue-26072.firebasestorage.app",messagingSenderId:"1086957378949",appId:"1:1086957378949:web:1341607b4f11639c11f8ec"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);let user=null,stop=null,items=new Map();
const map=L.map("map").setView([46.6,2.5],5);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=s=>{try{let u=new URL(s);return["https:","http:"].includes(u.protocol)?u.href:""}catch{return""}};
function draw(){layer.clearLayers();for(const[id,d]of items){if(!Number.isFinite(d.lat)||!Number.isFinite(d.lng))continue;
let route="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(d.lat+","+d.lng);
let p=`<div class="popup-title">${esc(d.name)}</div><p>${esc(d.notes)}</p>${safe(d.photo)?`<a target="_blank" rel="noopener" href="${safe(d.photo)}">Voir la photo</a><br>`:""}${safe(d.link)?`<a target="_blank" rel="noopener" href="${safe(d.link)}">Lien utile</a><br>`:""}<a target="_blank" rel="noopener" href="${route}">Itinéraire</a><div class="meta">Ajouté par ${esc(d.createdBy)} · ${d.createdAt?.toDate?d.createdAt.toDate().toLocaleDateString("fr-FR"):"date récente"}</div><button data-edit="${id}">Modifier</button> <button class="red" data-del="${id}">Supprimer</button>`;
L.marker([d.lat,d.lng]).addTo(layer).bindPopup(p)}$("count").textContent=items.size+" destination(s) partagée(s)";}
async function locate(place){let r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(place));if(!r.ok)throw Error("Recherche de lieu indisponible. Réessaie dans un instant.");let a=await r.json();if(!a.length)throw Error("Lieu introuvable. Essaie avec une ville ou une adresse plus précise.");return{lat:+a[0].lat,lng:+a[0].lon}}
function openForm(d=null,id=""){$("form").reset();$("id").value=id;$("dlgtitle").textContent=d?"Modifier la destination":"Ajouter une destination";if(d){$("name").value=d.name||"";$("place").value=d.place||"";$("notes").value=d.notes||"";$("link").value=d.link||"";$("photo").value=d.photo||""}$("dlg").showModal()}
$("add").onclick=()=>openForm();$("cancel").onclick=()=>$("dlg").close();
$("form").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;try{let id=$("id").value,place=$("place").value.trim(),coords=await locate(place),data={name:$("name").value.trim(),place,notes:$("notes").value.trim(),link:safe($("link").value),photo:safe($("photo").value),...coords,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,"destinations",id),data);else await addDoc(collection(db,"destinations"),{...data,createdBy:user.email,createdAt:serverTimestamp()});$("dlg").close()}catch(e){alert(e.message||"Une erreur est survenue.")}finally{$("save").disabled=false}};
$("map").addEventListener("click",async e=>{let ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-del]");if(ed){let d=items.get(ed.dataset.edit);if(d)openForm(d,ed.dataset.edit)}if(del){let d=items.get(del.dataset.del);if(d&&confirm("Supprimer « "+d.name+" » pour toute la famille ?"))try{await deleteDoc(doc(db,"destinations",del.dataset.del))}catch(err){alert("Suppression impossible : "+err.message)}}});
$("connect").onclick=()=>signInWithRedirect(auth,provider);$("logout").onclick=()=>signOut(auth);
try{await getRedirectResult(auth)}catch(e){$("status").textContent="Connexion impossible : "+e.message}
onAuthStateChanged(auth,u=>{user=u;if(stop){stop();stop=null}if(!u){$("status").textContent="Connecte-toi avec ton compte Google familial.";$("connect").hidden=false;$("logout").hidden=true;$("add").disabled=true;items.clear();draw();return}
$("status").textContent="Connecté : "+u.email;$("connect").hidden=true;$("logout").hidden=false;$("add").disabled=false;
stop=onSnapshot(query(collection(db,"destinations"),orderBy("createdAt","desc")),snap=>{items.clear();snap.forEach(x=>items.set(x.id,x.data()));draw()},err=>{$("status").textContent="Erreur de synchronisation : "+err.message})});
</script>
</body></html>
